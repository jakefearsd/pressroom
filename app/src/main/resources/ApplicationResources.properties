# Note: error.title.403/error.text.403/error.title.404/error.text.404 used to
# live here, for roller-ui/errors/403.jsp and 404.jsp. Those are
# container-level error pages reached via the servlet container's own error
# dispatch (see boot/WebContainerConfig's ErrorPageRegistrar), which resolves
# <fmt:message>'s locale off Accept-Language (falling back to the SERVER's
# default locale when that header is absent or unmatched) rather than the
# signed-in user's saved locale preference -- the page rendered in whatever
# language the request or host happened to carry, English or not. Those two
# JSPs (and error.jsp, which used to read errorPage.title/errorPage.message
# the same way -- those two keys are still live, via the Velocity
# error-page.vm/error-parse.vm) now hardcode their own (deliberately plain,
# pre-design-sprint) English text instead. error.permissionDenied.title/
# .prompt/.reason0-3 used to live here too, for roller-ui/errors/denied.jsp
# (a different page, reached via RollerHandlerInterceptor/RedirectController
# rather than the container's error dispatch) -- same <fmt:message> locale
# bug, same fix: denied.jsp now hardcodes English text and these six keys
# are gone rather than orphaned (see MessageKeyTest's orphan-key ratchet).

