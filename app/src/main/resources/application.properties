# Pressroom serves from the ROOT by default: https://example.com/<weblog>/, not
# https://example.com/pressroom/<weblog>/.
#
# The context path is a deployment detail and nothing in the app may assume a
# particular value for it. Every url the app emits is built from the context
# path the request actually arrived on -- InitFilter captures it per boot for
# the absolute/relative site urls, and anything sending a Location header adds
# request.getContextPath() itself (a leading-slash redirect resolves against
# the SERVER root, not the app root). WeblogRequestMapperTest and
# InitFilterTest pin both the root and the /pressroom case so neither can rot.
#
# Root is the default because the path segment is otherwise permanent: it lands
# in every canonical url, og:url, sitemap <loc>, feed id and inbound link, and
# removing it after a site has been indexed costs a redirect map rather than a
# config edit. It is also what lets a weblog own a bare hostname behind a
# reverse proxy, which is the normal production topology here (Caddy, and
# increasingly one hostname per weblog).
#
# To deploy under a prefix instead -- an external servlet container, or sharing
# a hostname with another app -- override it, either here or, in the container,
# with the environment variable SERVER_SERVLET_CONTEXT_PATH=/pressroom (Spring
# Boot relaxed binding; docker-compose.prod.yml passes the whole .env through).
# Boot normalises a lone "/" to the empty string, so "/" IS the root, not a
# one-character prefix.
#
# NOTE the default context path moved to / in 0.1.4. An existing deployment that was
# already crawled under the old prefix should either keep the old value via the
# environment variable above, or add a permanent redirect at the proxy (see
# docker_deployment.md, "The context path", for the Caddy lines).
server.servlet.context-path=/
server.port=8080
spring.servlet.multipart.max-file-size=1000000000B
spring.servlet.multipart.max-request-size=1000000000B
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Lax, never Strict: the return from the sign-in provider is a cross-site
# navigation, and Strict drops the session that holds the OAuth2 state (reader
# sign-in spec, criterion 9; Wikantik lost sessions to this). Pinned by
# SessionCookiePolicyTest.
server.servlet.session.cookie.same-site=lax
# Production terminates TLS at Caddy and proxies to the app over plain HTTP,
# with the original scheme carried only in X-Forwarded-Proto (Caddy sets it
# on every proxied request). "framework" registers Spring's
# ForwardedHeaderFilter at highest precedence against /* for the whole
# container, so getScheme()/isSecure()/getRequestURL() are proxy-aware for
# the plain rendering servlets and InitFilter (which captures the absolute
# context URL every canonical/og:url/sitemap <loc> is built from), not just
# Spring MVC. Without this, every absolute URL Pressroom emits behind the proxy
# says http://. Plain-http dev requests carry no X-Forwarded-* headers, so
# the filter is a no-op there.
server.forward-headers-strategy=framework
# The filter above rewrites getScheme()/isSecure()/getRequestURL() from
# X-Forwarded-Proto, but does NOT touch getRemoteAddr() -- that is Tomcat's
# RemoteIpValve, configured separately here. Caddy is this stack's only
# ingress (docker_deployment.md's TLS section), and every request the app
# sees arrives over the docker-compose network from Caddy's container IP;
# without this, getRemoteAddr() reports THAT IP for every reader on the
# internet, collapsing the contact-form, newsletter-subscribe and
# password-reset throttles (and FormSubmission.clientIp) onto one shared
# key instead of one per actual client. RemoteIpValve only trusts
# X-Forwarded-For from its default internal-proxies ranges (private/
# loopback addresses) as the immediate peer, so an external client cannot
# spoof its way past a throttle by forging the header -- only Caddy's own
# hop is trusted. The password-reset throttle is the security-relevant
# case: it exists to suppress a flood of reset requests per source
# address, which this makes per-reader again instead of per-proxy. Plain
# HTTP dev requests carry no X-Forwarded-For, so the valve is a no-op there
# and getRemoteAddr() reports the real (loopback/LAN) peer as before.
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.error.whitelabel.enabled=false
# DispatcherServlet is registered at *.rol only (ServletRegistrationConfig,
# transcribing web.xml's servlet-mapping exactly), not Boot's usual "/"
# catch-all -- so neither Spring MVC's own static-resource handling nor the
# /webjars/** resource handler in WebMvcConfig ever sees a request for
# plain static assets (webapp-root CSS/JS/images, or classpath webjars).
# Boot leaves Tomcat's built-in default Servlet unregistered by default
# specifically because DispatcherServlet-at-"/" normally replaces its role;
# with DispatcherServlet scoped to *.rol only, that assumption no longer
# holds, so it must be turned back on explicitly for any static content
# (including /webjars/**, which Tomcat serves directly out of
# META-INF/resources inside WEB-INF/lib jars, bypassing Spring MVC/
# WebMvcConfig entirely) to be reachable at all.
server.servlet.register-default-servlet=true
# DispatcherServlet is scoped to *.rol only (see comment above), so Boot's
# usual /actuator/** mapping under the main servlet is unreachable -- there is
# no "/" catch-all to register it against. Give actuator its own embedded
# connector on a separate port instead, which sidesteps the *.rol mapping and
# the pathPatternRequestMatcherBuilder override entirely: management.server.port
# spins up a second, independent web server just for actuator endpoints. This
# port is management-only and must not be exposed outside localhost/the
# deploy host in production (e.g. keep it off any public load balancer/
# firewall allow-list) -- it is not protected by SecurityConfig.
management.server.port=8090
management.endpoints.web.exposure.include=health
spring.devtools.livereload.enabled=false

# Filter order 40 in the web.xml-derived chain transcribed into
# ServletRegistrationConfig (order 30 = SpringFirewallExceptionFilter,
# order 50 = BootstrapFilter): springSecurityFilterChain must run right
# after the firewall-exception filter and before BootstrapFilter, exactly
# as web.xml's filter-mapping order required. Dispatcher types match the
# old <dispatcher>REQUEST</dispatcher><dispatcher>FORWARD</dispatcher>
# pair on the securityFilter mapping.
spring.security.filter.order=40
spring.security.filter.dispatcher-types=request,forward

# The automation API's machine-readable document. Configured relative to
# /v1, not /api/v1: the automation API's DispatcherServlet mapping
# (ServletRegistrationConfig.API_URL_PATTERNS, a servlet-spec prefix mapping
# on /api/*) strips the /api servlet-path prefix from the lookup path before
# Spring MVC ever sees it -- every controller under ui.restapi.v1 is mapped
# the same way, relative to /v1. The document therefore serves externally at
# GET /api/v1/openapi.json, guarded by the same apiSecurityFilterChain as
# every other /api/** route (Basic or Bearer; only POST /api/v1/tokens and
# GET /api/v1/ping are permitAll) -- see docs/api/README.md.
# packages-to-scan is scoped to ui.restapi.v1 so the document describes only
# the automation API, never the JSP admin @Controllers elsewhere in the app.
# The UI (springdoc-openapi-starter-webmvc-ui) is not even on the classpath --
# this is an automation API for scripts and agents, not a browser explorer --
# but swagger-ui.enabled=false stays explicit as defence in depth against a
# future dependency change re-adding it by accident.
springdoc.api-docs.path=/v1/openapi.json
springdoc.packages-to-scan=com.wikantik.pressroom.ui.restapi.v1
springdoc.swagger-ui.enabled=false
