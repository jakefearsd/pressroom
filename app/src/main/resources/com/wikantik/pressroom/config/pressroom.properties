# pressroom.properties
#
# This file is for meant for Roller deployment properties
# Any properties that don't change at runtime are defined here
#
# You can override the values in this file in a couple ways ..
#   1. define a pressroom-custom.properties file and place it somewhere
#       at the root of one of your classpath locations.
#       for example:
#           $TOMCAT_HOME/common/classes
#           $PRESSROOM_LOCATION/WEB-INF/classes
#
#   2. specify a custom properties file via jvm option
#       example:
#           pressroom.custom.config=/path/to/properties/file
#
#   **NOTE: if you run multiple instances of pressroom on the same server
#           then you should beware of the fact that the override options above
#           may affect *all* of you running instances.  if you want to do
#           custom overrides for each instance then you must do it by
#           placing a pressroom-custom.properties file at WEB-INF/classes/ in
#           each of you pressroom installations.
#
# properties in this file are accessed like this ...
#    WebloggerConfig.getProperty("propname");


#-----------------------------------------------------------------------------
# Table of contents
#-----------------------------------------------------------------------------

# -- Required configuration settings
# -- Directory settings
# -- Feature specific settings
# -- Scheduled tasks configuration
# -- Cache configuration
# -- User management and security settings
# -- Rendering system
# -- Pluggable backend, page and editor plugins
# -- Log4j2 logging settings
# -- Other settings
# -- Experimental, deprecated and "undocumented" settings


#-----------------------------------------------------------------------------
# Required configuration settings
#-----------------------------------------------------------------------------

# Installation type 'manual' or 'auto'. The names are historical and read
# backwards; what each one does at startup:
# - 'manual' (the default): applies every pending migration in
#   bin/db/migrations itself, without asking, then starts.
# - 'auto': applies nothing. With the schema up to date it starts; with any
#   migration pending (or no schema at all) it does not start, and every
#   request, public pages included, is sent to the install wizard, whose
#   create/upgrade buttons apply the migrations. The production image uses
#   'auto' because its provision service has already migrated the database.
installation.type=manual

#---------------------------------
# Database configuration settings

# Specify database configuration type of 'jndi' or 'jdbc'
# Default is 'jdbc': Roller runs as an executable WAR under Spring Boot's
# embedded Tomcat, which has no JNDI environment to resolve 'jndi' against.
# External deployments to a full Servlet container that binds a DataSource
# under JNDI can still override this (and database.jndi.name below) via
# pressroom-custom.properties or an environment/system property.
database.configurationType=jdbc

# For database configuration type 'jndi',this will be used.
# If it does not start 'java:' then 'java:comp/env/' will be prepended
database.jndi.name=jdbc/pressroom

# For database configuration type of 'jdbc', you MUST override these
database.jdbc.driverClass=
database.jdbc.connectionURL=
database.jdbc.username=
database.jdbc.password=

#---------------------------------
# Mail server connection parameters

# Specify mail configuration type of 'jndi' or 'properties'
mail.configurationType=jndi

# For mail configuration type 'jndi', this will be used
mail.jndi.name=mail/Session

# For mail configuration type of 'properties', you MUST override hostname
mail.hostname=

# Only override mail username and password if your mail server requires them
#mail.username=
#mail.password=

# For mail configuration type 'properties': 'starttls' (default), 'ssl' or
# 'none'. starttls is required (not merely offered) whenever a username and
# password are configured, so credentials never go over the wire in the
# clear; ssl is implicit TLS (e.g. port 465); none is an explicit opt-out
# for a local relay with no TLS at all.
#mail.security=starttls


#-----------------------------------------------------------------------------
# Directory settings
#-----------------------------------------------------------------------------

# The directory in which Roller will upload files
mediafiles.storage.dir=${user.home}/pressroom_data/mediafiles

# The directory in which Roller 4.0 used to upload files
# (only set this if you want 4.0 to 5.0 migration of uploaded files to occur)
# uploads.dir=${user.home}/pressroom_data/uploads

# Directory in which search index is to be created 
# (delete this directory to force Roller to recreate the entire search index)
search.index.dir=${user.home}/pressroom_data/search-index

# The directory in which Roller will look for themes
themes.dir=${webapp.context}

# Allow theme reloading during development
# 1. You must be logged in.
# 2. Delete the style-sheet (Design | Style Sheet tab) from the weblog/theme you're changing.
# 3. To reload macros under path /WEB-INF/velocity, first modify the macro file and then trigger 
#    the reload by changing a template on the theme currently working on, then refresh the page.
themes.reload.mode=false

# How often (seconds) Velocity may re-check whether a shared theme's templates
# changed on disk before reusing the parse tree it already has. This applies
# whether or not themes.reload.mode is set: the templates are always cached
# now, and this is the staleness window, not an on/off switch.
#
# 0 disables the check entirely, which caches every parsed template for the
# life of the JVM -- correct for a container image whose themes cannot change,
# and wrong anywhere a theme is edited in place. Raising it trades edit latency
# for a slightly cheaper read path; the check itself is one timestamp
# comparison per template per interval, so there is very little left to win
# above a few seconds.
themes.reload.interval=5

#-----------------------------------------------------------------------------
# Feature specific settings
#-----------------------------------------------------------------------------

# True to enable group blogging. False to prevent users from creating more 
# than one weblog and from joining other weblogs.
# RUNTIME-SETTABLE: also defined in runtimeConfigDefs.xml, so this is the
# seed/fallback only. Once the pressroom_properties row exists the Admin
# Settings page owns the value and editing this file has no further effect.
groupblogging.enabled=true

#----------------------------------
# search

# Enables indexing of weblog entries and enables search servlet
search.enabled=true

#----------------------------------
# Contact form defences. The enabled flag and sizing are startup-scoped.
# min.seconds is the naive-bot timer: submissions reporting less elapsed
# time are silently dropped.
contact.throttle.enabled=true
contact.throttle.threshold=10
contact.throttle.interval=60
contact.throttle.maxentries=250
contact.form.min.seconds=3

# Forgot-password throttle, keyed both by remote address and by the
# lowercased identifier submitted (so hammering many identifiers from one
# address, or one identifier from many addresses, both trip it). Startup-
# scoped like the contact throttle -- sizing and the on/off switch both need
# a restart. Interval is 5 minutes by default: password-reset requests are
# rarer and worth a longer window than a contact form.
passwordreset.throttle.enabled=true
passwordreset.throttle.threshold=5
passwordreset.throttle.interval=300
passwordreset.throttle.maxentries=250

# Newsletter forwarding. Blank baseurl disables the endpoint (503), which is
# the dev default -- listmonk only exists in the production compose file.
newsletter.listmonk.baseurl=
newsletter.subscribe.throttle.enabled=true
newsletter.subscribe.throttle.threshold=10
newsletter.subscribe.throttle.interval=60
newsletter.subscribe.throttle.maxentries=250

# Reader comments: the per-account rate limit on comments and author replies
# (CommentService), as ALLOWED counts. At most window.limit in any
# window.seconds (at most 86400), and at most daily.limit a day; the next is
# refused with 429. Startup-scoped. A missing or unusable value falls back to
# the default shown, never to "no limit".
comments.throttle.window.limit=5
comments.throttle.window.seconds=600
comments.throttle.daily.limit=30

# Automation API throttle. Keyed by token digest for every endpoint except
# the mint endpoint (POST /api/v1/tokens), which takes a password and is
# keyed by client address instead -- see ApiTokenAuthFilter. Sizing is
# startup-scoped like the throttles above; only the on/off switch is
# runtime-settable (api.throttle.enabled, see runtimeConfigDefs.xml).
api.throttle.enabled=true
api.throttle.threshold=120
api.throttle.interval=60
api.throttle.maxentries=500

# Listmonk admin API, for "Send as newsletter". Create an API user in
# Listmonk (Admin -> Users) and put its credentials here. Blank disables
# the button.
newsletter.listmonk.apiuser=
newsletter.listmonk.apitoken=

# Umami analytics, served same-origin through Caddy's /analytics/* handle --
# that is what lets the tracker run under script-src 'self' without touching
# the theme CSPs. basePath is where Caddy mounts it on the blog's own origin;
# scriptName should match UMAMI_SCRIPT_NAME if you renamed the tracker to
# dodge content blockers. Startup-scoped: these describe the reverse proxy,
# which does not change while the JVM runs.
analytics.umami.basePath=/analytics
analytics.umami.scriptName=script.js

#-----------------------------------------------------------------------------
# Scheduled tasks configuration
#-----------------------------------------------------------------------------

# Scheduled Background Tasks ... all times are in minutes.
#
# Task properties should follow the given format ...
#     tasks.<taskname>.<prop>=<value>
#
# The *enabled* tasks are defined by tasks.enabled=<taskname>[,<taskname>]

# Tasks which are enabled.  Only tasks listed here will be run.
tasks.enabled=ScheduledEntriesTask,TrashPurgeTask

# client identifier.  should be unique for each instance in a cluster.
tasks.clientId=defaultClientId

# Publish scheduled weblog entries
tasks.ScheduledEntriesTask.class=com.wikantik.pressroom.business.runnable.ScheduledEntriesTask
tasks.ScheduledEntriesTask.startTime=immediate
tasks.ScheduledEntriesTask.interval=1
tasks.ScheduledEntriesTask.leaseTime=30

# Hard-delete weblog entries that have sat in the trash past the runtime
# property entry.trash.retention.days
tasks.TrashPurgeTask.class=com.wikantik.pressroom.business.runnable.TrashPurgeTask
tasks.TrashPurgeTask.startTime=startOfDay
tasks.TrashPurgeTask.interval=1440
tasks.TrashPurgeTask.leaseTime=30


#-----------------------------------------------------------------------------
# Cache configuration
#-----------------------------------------------------------------------------

# Remember... times are in seconds
# Default settings suitable for 100 user system

# Cache properties all follow the given format ...
#     cache.<cache_id>.<prop>=<value>
# we then pass all <prop>=<value> pairs into the cache manager when the cache
# is being constructed.  this makes it easy to add cache properties that can
# be used by the specified CacheFactory you are using.
#
# NOTE: it is expected that property validation happens in the CacheFactory

# The default cache implementation we want to use
cache.defaultFactory=com.wikantik.pressroom.util.cache.ExpiringLRUCacheFactoryImpl
cache.customHandlers=

# set "true" to NOT cache the custom pages for users who are logged in
cache.excludeOwnerEditPages=false

# Site-wide cache (all content for site-wide frontpage weblog)
cache.sitewide.enabled=true
cache.sitewide.size=50
cache.sitewide.timeout=1800

# Weblog page cache (all the weblog content)
cache.weblogpage.enabled=true
cache.weblogpage.size=400
cache.weblogpage.timeout=3600

# Feed cache (xml feeds -- Atom only, W2)
cache.weblogfeed.enabled=true
cache.weblogfeed.size=200
cache.weblogfeed.timeout=3600

# Per-weblog sitemap cache (/sitemap-<handle>.xml): one finished document per
# weblog and host, rebuilt when the weblog's lastModified moves
cache.sitemap.enabled=true
cache.sitemap.size=100
cache.sitemap.timeout=3600
# Largest sitemap held, in bytes (read at startup). A 50,000-url sitemap is
# ~15 MB, so size alone does not bound memory; a larger one is still served
# and still answers If-Modified-Since, but is rebuilt on every request.
cache.sitemap.maxBytes=2097152

# Finished entry HTML (shortcodes + Markdown + sanitizer), one slot per
# published entry and host, valid until the entry, its weblog's lastModified
# or the site/context url changes (read at startup). Bounded by total bytes,
# not count -- one slot is at most a sixteenth of the budget -- and by age.
cache.entryhtml.enabled=true
cache.entryhtml.maxBytes=16777216
cache.entryhtml.timeout=3600

# Salt cache (XSRF protection)
cache.salt.enabled=true
cache.salt.size=5000
cache.salt.timeout=3600


#-----------------------------------------------------------------------------
# User management and security settings
#-----------------------------------------------------------------------------

# Authentication method for Roller. Use 'db' for database-based authentication.
authentication.method=db

# With this settings, all users will have HTML posts sanitized.
weblogAdminsUntrusted=true


# Password security settings
passwds.encryption.algorithm=bcrypt

# Allows lazy upgrade from legacy encodings. Can be plaintext, SHA or MD5 or left empty.
# Should be set to the value of 'passwds.encryption.algorithm' used on old Roller installations.
passwds.encryption.lazyUpgradeFrom=SHA

# Role name to global permission action mappings
role.action.editor=login,weblog,comment
role.action.admin=login,weblog,admin,comment
# A reader (signed in with single sign-on) holds the comment action only. It
# implies no authoring action: login, weblog and admin all still refuse it.
role.action.reader=comment

# True to give the first user that is registered admin privileges
users.firstUserAdmin=true

# Normally, for security purposes Roller keeps usernames private and the user
# getUserName() method in templates actually returns the user's screenname.
# If you want templates to have access to real usernames, set this to false.
# RUNTIME-SETTABLE: also defined in runtimeConfigDefs.xml, so this is the
# seed/fallback only. Once the pressroom_properties row exists the Admin
# Settings page owns the value and editing this file has no further effect.
user.hideUserNames=true

#-----------------------------------------------------------------------------
# Rendering system
#-----------------------------------------------------------------------------

# The set of default Roller renderer factories.
rendering.pressroomRendererFactories=\
com.wikantik.pressroom.ui.rendering.velocity.VelocityRendererFactory

# The set of user defined renderer factories.  These are prepended to the list above.
rendering.userRendererFactories=

# (rendering.pressroomRequestMappers / rendering.userRequestMappers are gone:
# RequestMappingFilter constructs the one WeblogRequestMapper directly, with
# its dependencies -- see the DI wave spec, 2026-08-22, Decision 3.)

# Url path elements which can NEVER be considered a weblog url
# each represents a url at the application root, i.e. /<elem>/*
rendering.weblogMapper.pressroomProtectedUrls=\
pressroom-ui,images,theme,themes,\
index.jsp,favicon.svg,robots.txt,sitemap.xml,\
page,flavor,rss,atom,language,search,resource,\
webjars,api,newsletter

# Set of user defined protected urls.  These are added to the set above.
rendering.weblogMapper.userProtectedUrls=

# Path roots that belong to the APPLICATION rather than to any weblog. These
# are the only names reserved on a per-weblog custom domain (virtual hosting),
# where the weblog handle comes from the Host header and the whole path is
# weblog-relative -- so a weblog request context that is merely the SECOND
# segment on the site host (/<handle>/page/x) becomes the FIRST segment
# (/page/x) and must NOT be mistaken for a reserved application path.
#
# This is deliberately a SUBSET of pressroomProtectedUrls: that list additionally
# reserves the weblog request contexts (page, search, resource, and the legacy
# flavor/rss/atom/language), which only ever need reserving when the first
# segment is a weblog handle. Reserving them on a custom domain kills the
# theme stylesheet (/page/<theme>.css) on every page.
rendering.weblogMapper.appProtectedUrls=\
pressroom-ui,images,theme,themes,\
index.jsp,favicon.svg,robots.txt,sitemap.xml,\
webjars,api,newsletter

# Set of models to be made available for weblog page rendering
rendering.pageModels=\
com.wikantik.pressroom.ui.rendering.model.PageModel,\
com.wikantik.pressroom.ui.rendering.model.ConfigModel,\
com.wikantik.pressroom.ui.rendering.model.UtilitiesModel,\
com.wikantik.pressroom.ui.rendering.model.URLModel,\
com.wikantik.pressroom.ui.rendering.model.MessageModel,\
com.wikantik.pressroom.ui.rendering.model.MenuModel

# Set of models to be made available for weblog feed rendering
rendering.feedModels=\
com.wikantik.pressroom.ui.rendering.model.FeedModel,\
com.wikantik.pressroom.ui.rendering.model.ConfigModel,\
com.wikantik.pressroom.ui.rendering.model.UtilitiesModel,\
com.wikantik.pressroom.ui.rendering.model.URLModel,\
com.wikantik.pressroom.ui.rendering.model.MessageModel

# Set of models to be made available for weblog search rendering
rendering.searchModels=\
com.wikantik.pressroom.ui.rendering.model.SearchResultsModel,\
com.wikantik.pressroom.ui.rendering.model.ConfigModel,\
com.wikantik.pressroom.ui.rendering.model.UtilitiesModel,\
com.wikantik.pressroom.ui.rendering.model.URLModel,\
com.wikantik.pressroom.ui.rendering.model.MessageModel,\
com.wikantik.pressroom.ui.rendering.model.MenuModel

# Set of models to be made available for weblog page *preview* rendering
# NOTE: this *does* have some differences between the pageModels
rendering.previewModels=\
com.wikantik.pressroom.ui.rendering.model.PreviewPageModel,\
com.wikantik.pressroom.ui.rendering.model.ConfigModel,\
com.wikantik.pressroom.ui.rendering.model.UtilitiesModel,\
com.wikantik.pressroom.ui.rendering.model.PreviewURLModel,\
com.wikantik.pressroom.ui.rendering.model.MessageModel,\
com.wikantik.pressroom.ui.rendering.model.MenuModel

# Set of page models specifically for site-wide rendering
rendering.siteModels=\
com.wikantik.pressroom.ui.rendering.model.SiteModel

# Velocity settings
velocity.properties=/WEB-INF/velocity.properties

# Raster tile template the #showMapAssets macro hands to Leaflet for the
# [map] shortcode. Deliberately a static property rather than a
# runtimeConfigDefs entry: a runtime property would need a configForm.*
# message key that only ever appears in XML, which MessageKeyTest's orphan
# ratchet counts as unused.
#
# The default is OpenStreetMap's standard layer. Its usage policy
# (operations.osmfoundation.org/policies/tiles/) covers exactly this shape of
# traffic -- interactive human viewing of a handful of low-traffic blogs --
# but it is best effort with no SLA, so a busy install should point this at
# its own tile server or a commercial provider. Note there is no {s}
# subdomain placeholder: the a/b/c aliases are deprecated (HTTP/2 made domain
# sharding pointless) and may be withdrawn without notice. The policy also
# forbids a restrictive Referrer-Policy and forbids proxying tiles through
# the server, so tiles must stay browser-direct.
travel.map.tileUrl=https://tile.openstreetmap.org/{z}/{x}/{y}.png


#-----------------------------------------------------------------------------
# Log4j2 logging settings
#-----------------------------------------------------------------------------
# Set this property to replace Roller's default log4j2 config with your own.
# Feel free to use log4j2.xml located in roller.war/WEB-INF/classes as template
#log4j.configurationFile=resources/log4j2.xml

#-----------------------------------------------------------------------------
# Other settings
#-----------------------------------------------------------------------------

# Values of the properties in this list get system property expansion 
# applied to them when loaded.
config.expandedProperties=uploads.dir,search.index.dir,mediafiles.storage.dir

# True to enable history in Atom feeds with next/prev links
site.newsfeeds.history.enabled=false

# Some folks consider remember-me type functionality to be a security risk
# If you enable remember me you MUST define a unique secret key that is not 'springRocks'
rememberme.enabled=false
rememberme.key=springRocks

# specifies the max number of tags allowed in URL ( /feed?tags=foo+bar+baz )
tags.queries.maxIntersectionSize=3

# Characters to be allowed in user names (change at your own risk)
username.allowedChars=A-Za-z0-9

# Starting with Roller 5.1 SEO-friendlier hyphens instead
# of underscores used by default to separate words in blog
# URLs.  Set to true below to use pre-5.1 default of
# underscores instead. Only affects anchors generated after the change;
# existing permalinks keep the separator they were created with.
# RUNTIME-SETTABLE: also defined in runtimeConfigDefs.xml, so this is the
# seed/fallback only. Once the pressroom_properties row exists the Admin
# Settings page owns the value and editing this file has no further effect.
weblogentry.title.useUnderscoreSeparator=false

# Seconds a new entry's save waits for its weblog's anchor lock, held by a
# concurrent create of the same weblog until that commits. A save that waits
# longer fails and rolls back rather than hanging a request thread (see
# docs/dev/database.md, "Entry anchors"). 0 waits forever.
weblogentry.anchor.lockTimeoutSeconds=10

# comma-separated list of top-level categories to be created in each new weblog
newuser.categories=Technology,Finance,General

# EclipseLink JPA properties
eclipselink.persistence-context.flush-mode=auto
eclipselink.logging.logger=org.eclipse.persistence.logging.slf4j.SLF4JLogger

# EclipseLink's shared (second-level) cache, per entity. SoftWeak holds the
# N most recently cached objects of a type softly (the JVM clears them only
# under memory pressure) and the rest weakly (gone at the next GC, then read
# again from the database). EclipseLink's own default, 100 for every type,
# made every permalink of a site with more than 100 entries re-read its row.
# Entries carry their text, so they get their own bound. Measured: ~4.4 KB
# each with three tags, plus the text (2 bytes a character once a post holds
# any character outside Latin-1, e.g. an em dash), so 5000 is ~25 MB at
# 500-character posts and ~72 MB at 5,000. Revisions are full copies of a
# post, stored on every save and rarely read again: 100. The rest take the
# 1000 default: small types (weblogs, users, categories, templates,
# permissions, media metadata), and tags, attributes and reader comments,
# each of which holds its entry. So up to ~3,000 more entries can stay live
# (all softly), a worst case of ~117 MB at 5,000-character posts; in
# practice tags are cached with their own entry and overlap it.
# Roller runs as one JVM and writes through JPA, so the cache is never
# stale; a row edited with SQL behind its back is, until a restart
# (docs/dev/database.md, "Shared cache sizes"). Startup properties: override
# in pressroom-custom.properties. A PRESSROOM_* variable works only for a key
# listed here (e.g. PRESSROOM_ECLIPSELINK_CACHE_SIZE_WEBLOGENTRY): EclipseLink
# matches entity names case-sensitively, and an unlisted key arrives
# lowercased and is ignored without an error.
eclipselink.cache.type.default=SoftWeak
eclipselink.cache.size.default=1000
eclipselink.cache.size.WeblogEntry=5000
eclipselink.cache.size.WeblogEntryRevision=100

# Lucene configurations
lucene.analyzer.class=org.apache.lucene.analysis.standard.StandardAnalyzer
lucene.analyzer.maxTokenCount=1000

# Certificate zones for per-weblog custom domains (virtual hosting).
#
# Comma-separated apex names covered by the proxy's wildcard certificate, e.g.
# "thelocalwiki.com" for a *.thelocalwiki.com cert. Saving a weblog domain
# outside these zones produces a WARNING on Weblog Settings and nothing more --
# no code path gates on this property. It exists so a typo'd subdomain is
# caught at the moment of the mistake rather than surfacing as a browser TLS
# error later. Empty means warn about nothing.
vhost.cert.zones=

# Single sign-on (readers)
#
# Readers sign in with an OpenID Connect provider (Google by default). Sign-in
# is offered only when BOTH the client id and secret are set. The discovery
# value may be the issuer URL itself or its /.well-known/openid-configuration
# URI. The secret is never logged.
sso.oidc.client.id=
sso.oidc.client.secret=
sso.oidc.discovery.uri=https://accounts.google.com/.well-known/openid-configuration
sso.provider.label=Google

#-----------------------------------------------------------------------------
# Experimental, deprecated and "undocumented" settings
#-----------------------------------------------------------------------------

# Allow users to edit the original path setting of media files
mediafile.originalPathEdit.enabled=false
