# specify resource loaders to use
resource.loaders = webapp, theme, pressroom, class

# theme resource loader
resource.loader.theme.public.name=theme
resource.loader.theme.description=Roller Theme Resource Loader
resource.loader.theme.class=com.wikantik.pressroom.ui.rendering.velocity.ThemeResourceLoader
# Parsed-template caching, rechecked on an interval.
#
# With cache=false Velocity re-read AND re-parsed every theme template on
# every single request, in production as well as development; the parser
# (StandardParserTokenManager, JJTStandardParserState, Token allocation) was
# around a tenth of render CPU in a profile of ordinary read traffic.
#
# Caching is safe to turn on because ThemeResourceLoader now answers
# getLastModified()/isSourceModified() honestly, from the theme's own disk
# timestamp, instead of hardcoding "never modified". Velocity consults them
# at most once per modification_check_interval seconds, so an edited theme is
# picked up within that window rather than needing a restart, and a theme that
# has not changed costs one long comparison every few seconds.
#
# The interval is overridden at startup from the roller property
# themes.reload.interval (see PressroomVelocity); this value is the fallback.
resource.loader.theme.cache=true
resource.loader.theme.modification_check_interval=5

# for the loader we call 'roller', use the PressroomResourceLoader
resource.loader.pressroom.public.name=pressroom
resource.loader.pressroom.description=Pressroom Main Resource Loader
resource.loader.pressroom.class=com.wikantik.pressroom.ui.rendering.velocity.PressroomResourceLoader
# MUST stay false, and this is load-bearing rather than a default nobody got
# round to changing. PressroomResourceLoader serves CUSTOM templates from the
# database and answers isSourceModified() -> false / getLastModified() -> 0
# unconditionally -- the same lie ThemeResourceLoader used to tell, and the
# reason its cache had to be off too. With caching on, those answers pin every
# parsed template for the life of the JVM: editing a custom template would do
# nothing at all until a restart, silently, on the screen whose entire purpose
# is editing templates. Turning this on is only safe AFTER the loader is taught
# to report a real timestamp, exactly as ThemeResourceLoader was above.
# LoaderCachingContractTest fails the build if this pairing is broken.
resource.loader.pressroom.cache=false
resource.loader.pressroom.modification_check_interval=60

# for the loader we call 'class', use the ClasspathResourceLoader
resource.loader.class.description = Velocity Classpath Resource Loader
resource.loader.class.class = org.apache.velocity.runtime.resource.loader.ClasspathResourceLoader
resource.loader.class.cache=true
resource.loader.class.modification_check_interval=60

# for the loader we call 'webapp', use the WebappResourceLoader
resource.loader.webapp.description=Webapp Resource Loader
resource.loader.webapp.class=com.wikantik.pressroom.ui.rendering.velocity.WebappResourceLoader
resource.loader.webapp.cache=true
resource.loader.webapp.path=/WEB-INF/velocity,/WEB-INF/velocity/templates,/WEB-INF/velocity/templates/feeds,templates/weblog
resource.loader.webapp.modification_check_interval=60

# log invalid template references?
# set this to false to have a quieter velocity.log
runtime.log.invalid.reference=false

# tell Velocity to use Log4J
runtime.log.logsystem.log4j.category=org.apache.velocity

# modern JVMs have fast deduplication
runtime.string_interning=false

# Override the default global library, set to blank to load no default
velocimacro.library.path = weblog.vm,feeds.vm,pressroom-custom.vm

# See PressroomVelocity for reloading "resource.loader.webapp.path" files via WebappResourceLoader settings
velocimacro.library.autoreload=false

# Allow Velocimacros to be defined in regular templates
velocimacro.inline.allow=true

# Allow template authors to define macros in any template
velocimacro.inline.local_scope=false

# set encoding/charset to UTF-8
resource.default_encoding=UTF-8
default.contentType=text/html; charset=utf-8

introspector.uberspect.class=org.apache.velocity.util.introspection.SecureUberspector

