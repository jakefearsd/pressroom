# Browser ITs run CLASS-PARALLEL. Methods within a class stay on one thread.
#
# The suite was 14.1 minutes of test time across 34 classes on a single thread,
# on a machine with 16 cores. Nothing about it needed to be serial: Selenide's
# WebDriver is thread-local, so each worker gets its own browser, and most IT
# classes create the weblog and user fixtures they touch (TestUtils/`createWeblog`)
# rather than sharing one.
#
# What is NOT safe to run concurrently is the handful of classes that mutate
# GLOBAL runtime properties through PressroomIT.setGlobalFlag -- there is one app
# instance and one set of properties behind it, so two such classes overlapping
# would each see the other's flag. Those carry
# @ResourceLock(PressroomIT.GLOBAL_CONFIG), which serialises them against EACH
# OTHER while still letting them run alongside the ~29 classes that touch no
# global state. @Isolated would have been the blunt alternative and would have
# stalled the whole suite for the duration of each one.
#
# METHODS stay same_thread deliberately. A test class here is a narrative --
# create a weblog, edit it, publish, assert the rendered page -- and its methods
# frequently share fixtures created in @BeforeAll. Parallelising within a class
# would break that for no gain, since the parallelism we need is already
# available across 34 classes.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Fixed rather than dynamic: each worker holds a Chrome, so the binding
# constraint is memory, not cores. Four browsers is comfortable on a 16-core
# box and keeps the machine usable while the suite runs.
#
# fixed.parallelism ON ITS OWN IS A TARGET, NOT A CAP -- and for a long time
# this file set only that, so it bounded nothing. JUnit's fixed strategy hands
# the number to a ForkJoinPool, which compensates for blocked tasks by spawning
# additional threads, and a Selenium test blocks on nearly every line. Measured
# on this repository: -Dit.parallelism=1 still ran four IT classes concurrently
# (~17s wall clock for four ~10s classes, not ~40s), and a CI run with
# -Dit.parallelism=2 started 24 classes inside four seconds. That is how a
# GitHub-hosted runner came to be launching ~30 Chromes at once.
#
# fixed.max-pool-size below is the ceiling that was missing. The FIXED strategy
# reads THREE parameters, not one, and this is the one that says how far the
# pool may grow to replace blocked threads: its default is 256, which is why
# the target never held. Both are pinned to the same ${it.parallelism} so one
# number decides the target and the cap together.
#
# fixed.saturate is the third, and is deliberately left at its default. It
# reads like the knob for this and is inverted: the default `true` means "do
# not throw when the pool cannot grow, just proceed with fewer threads", which
# is the behaviour we want. Setting it `false` makes ForkJoinPool throw
# RejectedExecutionException at a blocked join instead.
#
# That went unnoticed until the runner image moved to ubuntu24/20260816.277,
# after which the nightly failed six nights running with Chrome renderer
# timeouts landing on a different handful of classes each time, several
# reporting a NEGATIVE remaining deadline -- the browser was never scheduled
# inside its own timeout. Starvation, not a slow page; no timeout increase
# fixes it.
#
# The other bound, junit.jupiter.execution.parallel.enabled, involves no pool
# at all. it-selenium/pom.xml exposes both as ${it.parallel.enabled}
# and ${it.parallelism} on the failsafe fork (a system property beats this
# file); CI passes -Dit.parallel.enabled=false and runs the suite serially.
# ItCiWorkflowTest pins that split.
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4
junit.jupiter.execution.parallel.config.fixed.max-pool-size = 4
