# Roller custom-config overlay for the browser IT suite (mvn verify -Pit).
#
# Loaded by the executable WAR via -Dpressroom.custom.config, pointed at the
# *filtered* copy of this file under target/test-classes (see it-selenium's
# testResources config). ${it.db.port}/${it.db.name}/${project.basedir}/
# ${it.work.dir}/${it.run.id}/${it.kc.port} below are Maven build properties substituted at
# process-test-resources time -- this file is not valid until filtered.

installation.type=manual

database.configurationType=jdbc
database.jdbc.driverClass=org.postgresql.Driver
database.jdbc.connectionURL=jdbc:postgresql://127.0.0.1:${it.db.port}/${it.db.name}
database.jdbc.username=pressroom
database.jdbc.password=pressroom

# use properties-based mail; no JNDI mail session in the executable WAR
mail.configurationType=properties
mail.hostname=localhost

# use src copy of themes for read-only access
themes.dir=${project.basedir}/../app/src/main/webapp/themes

# Work goes in the it-selenium module's own target dir, under a per-run
# subdirectory. Sharing these across runs meant a leaked app JVM from an
# earlier run still held the Lucene write lock on search-index and still owned
# the media directory the next run was about to write to -- cross-run
# interference from exactly the leak the harness now sweeps for. Per-run also
# keeps each run's uploads as evidence instead of mixing them together.
search.index.dir=${it.work.dir}/${it.run.id}/search-index
mediafiles.storage.dir=${it.work.dir}/${it.run.id}/mediafiles
uploads.dir=${it.work.dir}/${it.run.id}/uploads

# Reader sign-in (SSO) against the run's own Keycloak container (it-selenium/pom.xml,
# realm src/test/resources/keycloak/roller-it-realm.json), so SSO is ON for the whole
# suite. The secret is a TEST-ONLY value shared with the realm file (change the two
# together); it guards a throwaway container on localhost and nothing else.
# localhost, not 127.0.0.1: Keycloak derives its issuer from the Host it is asked on,
# and the browser and this app must both see the same one.
sso.oidc.client.id=roller-it
sso.oidc.client.secret=b99429513643428e10a1129cdff2a7122cc644fd625ae62b
sso.oidc.discovery.uri=http://localhost:${it.kc.port}/realms/roller-it/.well-known/openid-configuration
sso.provider.label=Keycloak

# Reader comments: CommentsIT posts as the seeded admin and its readers within
# minutes, and the production limit (5 in 10 minutes, 30 a day, per account)
# would make one more owner comment or reply a 429. The suite tests behaviour,
# not the limit; the unit tests prove the limit at its defaults.
comments.throttle.window.limit=1000
comments.throttle.window.seconds=600
comments.throttle.daily.limit=10000
