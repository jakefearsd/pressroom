# Local development stack for Roller.
#
#   ./pressroom dev     start postgres, apply migrations, run the app via
#                     spring-boot:run (embedded Tomcat)
#   ./pressroom db      start postgres only
#
# To run Roller itself in a container instead of via spring-boot:run, see
# docker-compose.prod.yml (production stack: app + postgres + caddy +
# backup) or build the image directly with `docker build .` (see Dockerfile).

# The project name is explicit so the volumes are pressroom_pressroom-pgdata18
# whatever the checkout directory is called.
name: pressroom

services:

  postgres:
    # Pinned by digest (postgres:18 at time of pin). Testcontainers uses the
    # same major version — see PressroomPostgresContainer.
    #
    # Production (docker-compose.prod.yml) is still on 16: moving it is a data
    # migration with its own cutover, not an image bump.
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      # 5433 on the host: 5432 is commonly taken by a locally-installed
      # PostgreSQL. Override with DEV_DB_PORT if 5433 is busy too. Deliberately
      # NOT named PRESSROOM_DB_PORT: that prefix is reserved for the app's own
      # configuration (see docker-compose.prod.yml/docker_deployment.md), and a
      # stray PRESSROOM_DB_PORT would be overlaid onto the app's properties as a
      # junk key named "db.port" -- same reasoning as SITE_DOMAIN/IMAGE_VERSION
      # in the production compose file.
      - "${DEV_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: pressroom
      POSTGRES_USER: pressroom
      POSTGRES_PASSWORD: pressroom
    volumes:
      # Named volume, not a bind mount: dev content survives restarts and
      # `docker compose down`. Use `docker compose down -v` to wipe it.
      #
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data: 18 moved
      # its data directory to a version-specific subdirectory (18/docker) and
      # declares the parent as its VOLUME. An old-layout cluster found at the
      # legacy path makes the entrypoint refuse to start, on purpose.
      #
      # The volume is also renamed, so the 16 cluster in the old volume is left
      # untouched as the rollback. Remove it once 18 has proven itself (it was
      # named for the project's former name, so `docker volume ls` finds it):
      #   docker volume rm roller_roller-pgdata   (rebrand:keep)
      - pressroom-pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressroom -d pressroom"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pressroom-pgdata18:
