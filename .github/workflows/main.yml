name: Pressroom

# Two tiers, split by what each costs.
#
# The unit suite is ~3 minutes, so it gates every push -- a regression there
# should never survive the commit that caused it. The browser ITs are ~16
# minutes of Chrome driving a real WAR against a real Postgres, and paying
# that on every push made a red mail arrive for things a re-run fixes (see
# the GalleryIT upload race). They run nightly and on demand instead.
#
# Publishing is NOT here. Pushing to master used to publish
# ghcr.io/jakefearsd/pressroom:latest, which meant every commit silently became
# the image `deploy/deploy.sh` would pull next. Images now come from a
# release tag only -- see release.yml.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC -- browser ITs

# A rapid series of pushes should leave one run standing, not a queue of
# runs all testing superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared rather than relied upon.
#
# Nothing in this workflow writes to the repository: it builds, tests, checks
# diff coverage, and uploads an artifact. The repository's default workflow
# token is already read-only, so this block grants nothing new -- it is here so
# the guarantee survives someone flipping that org/repo default, which is a
# setting no reviewer of this file can see. Jobs needing more must say so
# themselves; release.yml is where publishing rights live.
permissions:
  contents: read

jobs:
  build-test:
    name: Build+Test on Linux/JDK ${{ matrix.java }}
    # The nightly tick exists for the ITs; the unit suite already ran on the
    # commit that produced this tree.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # maven-compiler-plugin is configured with <release>25</release>, so
        # JDK 11, 17, and 21 cannot compile this project at all.
        java: [ '25' ]

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: maven

      # CwebpEncoder shells out to this binary and is feature-detected, so
      # its absence does not fail anything -- it makes three tests SKIP
      # (CwebpEncoderTest, MediaFileTest, MediaResourceServletRenderingTest),
      # silently, while the job stays green. The Dockerfile installs the same
      # package, so without this the WebP rendition path shipped to production
      # had no automated coverage that ever executed. Pinned by ItCiWorkflowTest.
      - name: Install cwebp (WebP renditions)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp

      - name: Build Pressroom and run JUnit Tests
        run: mvn -V -ntp install

      - name: Diff coverage gate (90% on changed lines)
        if: matrix.java == '25'
        run: |
          pip install diff_cover
          mvn -ntp -pl app jacoco:report
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No base commit to diff against; skipping."
            exit 0
          fi
          bin/check-diff-coverage.sh "$BASE"

      - name: Publish JUnit Report
        # Third-party: pinned to a commit SHA, not the mutable v2 tag.
        # Runs with the read-only token above, so its blast radius is far
        # smaller than the release action's was -- but it is still someone
        # else's code on every push, and a tag can be moved.
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
          paths: "app/target/surefire-reports/TEST-*.xml"

      # only on integration and only once in this matrix
      - name: Upload Dev Build on Integration
        if: ${{ (matrix.java == '25') && (github.event_name == 'push') }}
        uses: actions/upload-artifact@v7
        with:
          name: dev-build
          path: ./app/target/pressroom.war
          retention-days: 90
          if-no-files-found: error

  integration-test:
    name: Browser ITs on Linux/JDK 25
    # Nightly, on a PR, or when asked for from the Actions tab -- but not on
    # every push to master. Run them locally before a release with
    # `mvn verify -Pit`; release.yml does not re-run them.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      # Chrome ships on ubuntu-latest; PressroomIT runs it headless.
      #
      # -Dit.parallel.enabled=false: CI runs the browser suite SERIALLY.
      #
      # A hosted runner is not the 16-core developer box junit-platform
      # .properties' parallelism of 4 was tuned for, and it inherited that
      # number silently until the runner image moved to ubuntu24/20260816.277,
      # after which every nightly failed with Chrome renderer timeouts spread
      # across a different handful of classes each run -- several with a
      # negative remaining deadline, i.e. the browser was never scheduled
      # inside its own timeout.
      #
      # Turning the number DOWN was tried first and changed nothing, because
      # the number bounds nothing: JUnit's fixed strategy treats parallelism as
      # a target for a ForkJoinPool that compensates for blocked tasks by
      # spawning more threads, and Selenium blocks constantly. That run passed
      # -Dit.parallelism=2 and still started 24 classes within four seconds;
      # locally, -Dit.parallelism=1 still ran four classes concurrently.
      # Disabling parallel execution is a different code path with no pool in
      # it, and is the only bound that holds. It costs wall clock (~14 minutes
      # of test time rather than ~8) on a job with a 45-minute timeout that
      # runs overnight. ItCiWorkflowTest pins this.
      - name: Run browser integration tests
        run: mvn -V -ntp verify -Pit -Dit.parallel.enabled=false

      # The app log lives only on the runner and dies with it, which is why six
      # consecutive red nightlies produced nothing anyone could read afterwards
      # -- and why a separate, genuinely code-shaped failure on this same job
      # (the 403 on createUser!save.rol, CLAUDE.md's "MECHANISM NOT
      # ESTABLISHED") has stayed unexplained. A Selenium stack trace says what
      # the browser could not do; app-<run id>.log is the only record of what
      # the SERVER did.
      - name: Upload IT diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: it-diagnostics
          path: |
            it-selenium/target/it-work/**
            it-selenium/target/failsafe-reports/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish IT Report
        # Third-party: pinned to a commit SHA, not the mutable v2 tag.
        # Runs with the read-only token above, so its blast radius is far
        # smaller than the release action's was -- but it is still someone
        # else's code on every push, and a tag can be moved.
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        if: always()
        with:
          paths: "it-selenium/target/failsafe-reports/TEST-*.xml"
