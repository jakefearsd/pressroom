name: Release

# Fires when a tag matching v*.*.* is pushed. Runs the unit suite and
# coverage gates, publishes the app and caddy production images to GHCR as
# :<version>, :latest and :sha-<short>, and creates a GitHub Release with a
# self-contained deploy bundle attached (the WAR extracted from the app
# image, docker-compose.prod.yml, .env.example, deploy.sh).
#
# This is the ONLY thing that publishes an image. `docker-compose.prod.yml`
# requires `IMAGE_VERSION` to be set in `.env` (`${IMAGE_VERSION:?...}`, no
# floating default) and `deploy/deploy.sh` pulls whatever that names, so
# `:latest` means "the last tagged release" rather than "the last commit
# anyone pushed", and an operator who forgets to set it gets a loud compose
# error, not a silent pull of the wrong image. `deploy.sh` no longer has a
# `--build` flag -- there is nothing to build from on a deploy host that
# holds no checkout; to deploy an untagged tree, build and push the images
# yourself under a version you then set as `IMAGE_VERSION`.
#
# main.yml triggers on `push: branches: [master]`, which a tag push does not
# match, so a tag alone would never wait on the unit suite -- the `test` job
# below runs it here, gated with `needs:` on the publish job, instead of
# racing main.yml's copy on the same commit.
#
# To cut a release:
#   1. mvn -Pit versions:set -DnewVersion=0.1.1 -DgenerateBackupPoms=false
#      (-Pit is required: it-selenium is a profile-only module, and without it
#      its parent version silently stays behind)
#   2. Run the browser ITs locally: mvn verify -Pit
#      (still not run by this workflow -- see main.yml's integration-test
#      job for why they stay off the push/tag path)
#   3. git commit -am "release: 0.1.1"
#   4. git tag v0.1.1 && git push origin master v0.1.1

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create the GitHub Release
  packages: write    # push to ghcr.io

jobs:
  test:
    name: Unit suite and coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only needs to check out the repo -- the workflow-level packages: write
    # (for the release job's GHCR push) is not this job's to inherit.
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      # main.yml triggers on `push: branches: [master]`, which a TAG push does
      # not match -- so in the documented release flow
      # (`git push origin master v0.1.1`) the unit suite and this workflow race,
      # with no dependency between them. Without this job a tag on a commit that
      # never passed build-test publishes anyway. `install` runs `verify`, so
      # this covers the JaCoCo floors too.
      - name: Build and run the unit suite
        run: mvn -V -ntp install

  release:
    name: Build, publish images, create release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Declared rather than inherited. These are the same two grants the
    # workflow-level block above makes, so this changes nothing today -- it is
    # here so that a step added to this job later cannot pick up write access
    # by accident, and so the one job that genuinely publishes says so at the
    # point a reader is looking. The `test` job above narrows to contents:read
    # for the same reason.
    permissions:
      contents: write    # create the GitHub Release
      packages: write    # push to ghcr.io

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Extract version from tag
        id: version
        run: |
          # v0.1.1 -> 0.1.1
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GHCR requires an all-lowercase repository path; github.repository keeps
      # the casing configured on GitHub.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
            ghcr.io/${{ env.IMAGE_REPO }}:sha-${{ steps.version.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the caddy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/caddy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}-caddy:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPO }}-caddy:latest
            ghcr.io/${{ env.IMAGE_REPO }}-caddy:sha-${{ steps.version.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image build is the ONLY build of the WAR. Extracting the artifact
      # from the image it shipped in means the WAR attached to this Release and
      # the WAR running in production are the same bytes; running `mvn package`
      # separately produced a second, merely-equivalent binary.
      - name: Extract the WAR from the published image
        run: |
          image="ghcr.io/${IMAGE_REPO}:${{ steps.version.outputs.version }}"
          docker pull "$image"
          cid="$(docker create "$image")"
          mkdir -p release-assets
          docker cp "$cid:/app/roller.war" release-assets/roller.war
          docker rm "$cid"
          cp docker-compose.prod.yml release-assets/
          # GitHub renames any release asset whose filename starts with a
          # dot, so ".env.example" would not download as itself -- copy it
          # to a dot-free name instead of shipping a runbook step that 404s.
          cp deploy/.env.example release-assets/env.example
          cp deploy/deploy.sh release-assets/deploy.sh
          cp bin/pressroom-api release-assets/pressroom-api
          ls -l release-assets

      # Deliberately the GitHub CLI rather than a third-party action.
      #
      # This step runs in the one job holding contents:write + packages:write,
      # with a live GHCR credential in its environment -- the highest-value
      # position in this repository for someone else's code to occupy. It used
      # to be softprops/action-gh-release@v3, pinned to a MUTABLE major tag, so
      # whatever that tag pointed at on release day ran here with rights to
      # publish images and rewrite releases.
      #
      # Pinning it to a commit SHA would have frozen that risk rather than
      # removed it: a pin still runs that maintainer's code, and every bump
      # (Dependabot's included) re-extends the trust. `gh` is preinstalled on
      # GitHub-hosted runners and maintained by the same party that already
      # owns the token, so this adds no trust relationship at all. The action's
      # features that were actually used map one-to-one, so nothing is lost.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The action's fail_on_unmatched_files: true. Worth keeping -- a
          # release whose deploy bundle is silently missing a file is worse
          # than a failed release, because the deploy fails on someone's host
          # instead of in CI. Explicit paths (not globs), so a missing asset is
          # a missing file rather than an unexpanded pattern.
          assets=(
            release-assets/roller.war
            release-assets/docker-compose.prod.yml
            release-assets/env.example
            release-assets/deploy.sh
            release-assets/pressroom-api
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::release asset missing: $asset" >&2
              exit 1
            fi
          done
          # A production host has no checkout, so everything it needs is here.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Roller ${VERSION}" \
            --generate-notes \
            "${assets[@]}"
