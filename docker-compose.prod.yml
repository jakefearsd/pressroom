# Production stack for Pressroom: app + postgres + caddy (TLS-terminating reverse
# proxy) + backup. The back-office services the app uses -- umami (analytics)
# and listmonk (newsletter), each on its own database server -- are in
# docker-compose.backoffice.yml, merged over this file while they run on this
# host and dropped once they run with the back-office suite (wiki SA-15).
# .env selects the files:
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.backoffice.yml
#
# which plain `docker compose` reads by itself, so every command in
# docker_deployment.md is `docker compose ...`, with no -f. deploy.sh adds
# that line to a .env from before 0.8.5. Nothing in this file waits for,
# networks with, or holds the credentials of a back-office service
# (ProductionComposeTest pins it), so it also runs alone.
#
# These files and .env are the ONLY things a production host needs. Nothing is
# bind-mounted from a checkout: the Caddyfile lives in the pressroom-caddy image,
# and provision.sh, migrate.sh, the migrations, umami-views.sql and the backup
# scripts all live in the pressroom image. ProductionComposeTest fails the build
# if a bind mount comes back.
#
# Requires Compose v2.17+ for depends_on: service_completed_successfully.
#
# First-time setup (see docker_deployment.md for the full runbook):
#   curl -LO <release-url>/docker-compose.prod.yml
#   curl -LO <release-url>/docker-compose.backoffice.yml
#   curl -L  <release-url>/env.example -o .env   # GitHub strips the dot
#   curl -LO <release-url>/deploy.sh && chmod +x deploy.sh
#   # edit .env: real domain, real secrets, real SMTP
#   ./deploy.sh
# Use deploy.sh, not a bare `docker compose up -d`: it generates
# UMAMI_PRESSROOM_PASSWORD (Pressroom's Umami account), UMAMI_DB_PASSWORD and
# LISTMONK_DB_PASSWORD (the back-office database servers) when .env has none.
#
# Only caddy publishes off-host ports: its 80 and 443, on host ports 80/443
# unless SITE_HTTP_PORT/SITE_HTTPS_PORT move them (a host behind a tunnel
# connector on another machine). 8081 is the Umami dashboard, loopback-bound
# unless UMAMI_CONSOLE_BIND names the host's LAN address for a tunnel
# connector or proxy to reach. 8082 is loopback-bound and inert in production -- it
# exists so the same file serves a local run where LISTMONK_DOMAIN is a bare
# port instead of a hostname.

# Container-log rotation, shared by every service. Docker's default json-file
# driver never rotates, and the app writes its whole log to stdout, so without
# this the host's /var/lib/docker grows until the disk fills. 5 x 10 MB per
# container; `docker compose logs` reads across the rotated files.
# ProductionComposeTest pins it on every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pressroom}
      POSTGRES_USER: ${POSTGRES_USER:-pressroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # 18 keeps the cluster in a version-specific subdirectory
      # (/var/lib/postgresql/18/docker) and declares the PARENT as its VOLUME,
      # so the parent is what gets mounted. One volume then holds successive
      # majors side by side, which is what makes an in-place `pg_upgrade
      # --link` possible later. A pre-18 cluster must never be mounted here:
      # the entrypoint refuses to start on it rather than re-initialising.
      # PostgresMajorPinTest pins this path against the image's major.
      - pressroom-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pressroom} -d ${POSTGRES_DB:-pressroom}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  # One-shot: applies the pressroom migration chain and grants grafana_ro.
  # Every step is idempotent, so this runs on every `up -d` and is a no-op
  # once current. The app waits for it to EXIT SUCCESSFULLY, which is what replaced deploy.sh's hand-rolled
  # migrate-then-start ordering. The analytics views are a separate one-shot
  # (see `analytics-views` below) that runs after umami has started, because
  # the view they install depends on a table only umami itself creates.
  provision:
    image: ghcr.io/jakefearsd/pressroom:${IMAGE_VERSION:?IMAGE_VERSION must be set in .env}
    logging: *logging
    entrypoint: ["/app/provision.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pressroom}
      POSTGRES_USER: ${POSTGRES_USER:-pressroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    networks:
      - internal

  # The installer's account tool: create the first admin, reset a lost
  # password, or check that an admin exists. Never started by `up` -- only
  #   docker compose run --rm admin create --username NAME --email ADDRESS
  # Being able to run it at all means controlling this host, which is the
  # trust it relies on. It gets the database credentials and nothing else
  # from .env. See docker_deployment.md, "First run".
  admin:
    image: ghcr.io/jakefearsd/pressroom:${IMAGE_VERSION:?IMAGE_VERSION must be set in .env}
    logging: *logging
    entrypoint: ["/app/admin-account.sh"]
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pressroom}
      POSTGRES_USER: ${POSTGRES_USER:-pressroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    networks:
      - internal

  app:
    image: ghcr.io/jakefearsd/pressroom:${IMAGE_VERSION:?IMAGE_VERSION must be set in .env}
    logging: *logging
    depends_on:
      provision:
        condition: service_completed_successfully
    # The app's entire configuration is the PRESSROOM_* block in .env, overlaid on
    # the image's built-in defaults by WebloggerConfig. Everything else in .env
    # simply has no PRESSROOM_ prefix and is ignored by the app -- but env_file
    # loads the WHOLE file into the container's environment regardless, so
    # every secret in .env (POSTGRES_PASSWORD, UMAMI_APP_SECRET, etc.) is
    # visible to `docker inspect`/`/proc/1/environ` on this container too,
    # not just the PRESSROOM_* keys the app reads. Deliberate (one file, one
    # place to look), documented in docker_deployment.md's "Configure .env".
    env_file: .env
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
      # The back-office addresses (Umami's API, listmonk's) are not here:
      # docker-compose.backoffice.yml adds them while it runs those services,
      # and .env's PRESSROOM_* settings name them once they run elsewhere.
    volumes:
      - pressroom-mediafiles:/data/mediafiles
      - pressroom-search-index:/data/search-index
      - pressroom-uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: ghcr.io/jakefearsd/pressroom-caddy:${IMAGE_VERSION:?IMAGE_VERSION must be set in .env}
    logging: *logging
    # The app only, never a back-office service (SA-15): the blog must never
    # wait for analytics or the newsletter. An Umami that cannot start (a
    # failed umami-move) would otherwise leave caddy -- the blog's only way
    # in -- created but never started. Caddy dials ANALYTICS_UPSTREAM and
    # NEWSLETTER_UPSTREAM per request, so until they are up only their own
    # paths answer 502. ProductionComposeTest pins this.
    depends_on:
      - app
    ports:
      # Host side movable from .env; unset, these are 80 and 443. Only the
      # host side moves: Caddy still listens on 80 and 443 in the container.
      - "${SITE_HTTP_PORT:-80}:80"
      - "${SITE_HTTPS_PORT:-443}:443"
      # The Umami dashboard and API (the Caddyfile's :8081 site), internal
      # only. Loopback unless UMAMI_CONSOLE_BIND names this host's LAN
      # address, which is how a tunnel connector on another machine
      # reaches it; never a public interface (spec AC 19).
      # 8082 is inert in production: with a real hostname in LISTMONK_DOMAIN
      # Caddy serves that site on 443 and nothing listens here. Locally it is
      # ":8082" and this is how you reach the console. The HOST ports are
      # movable from .env: a host that already has 8081/8082 bound -- on any
      # address -- otherwise stops caddy, and with it the blog.
      - "${UMAMI_CONSOLE_BIND:-127.0.0.1}:${UMAMI_CONSOLE_PORT:-8081}:8081"
      - "127.0.0.1:${LISTMONK_CONSOLE_PORT:-8082}:8082"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set in .env (a real domain, or :80 for LAN/testing)}
      LISTMONK_DOMAIN: ${LISTMONK_DOMAIN:-newsletter.invalid}
      # Where Caddy reaches Umami (the tracker paths and the :8081 dashboard)
      # and listmonk (LISTMONK_DOMAIN's site). Unset, the services in this
      # compose project; a LAN address once they run with the back-office
      # services (SA-15). Never empty: Caddy cannot adapt a bare upstream.
      ANALYTICS_UPSTREAM: ${ANALYTICS_UPSTREAM:-umami:3000}
      NEWSLETTER_UPSTREAM: ${NEWSLETTER_UPSTREAM:-listmonk:9000}
      # The tracker file name the Caddyfile lets through, the same one umami
      # serves (TRACKER_SCRIPT_NAME below).
      UMAMI_SCRIPT_NAME: ${UMAMI_SCRIPT_NAME:-script.js}
      # The proxy whose X-Forwarded-* headers Caddy keeps (see the Caddyfile's
      # global block). Empty trusts none, which a public host needs.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Per-weblog custom domains (virtual hosting): unlike LISTMONK_DOMAIN
      # above, VHOST_ZONE unset can't just default to a
      # do-nothing hostname on its own -- the Caddyfile's wildcard block
      # carries `tls { dns cloudflare {$VHOST_DNS_API_TOKEN} }`, and an
      # EMPTY token fails to adapt the Caddyfile at all ("missing API
      # token"), which would take the whole proxy down, SITE_DOMAIN
      # included, not just this block. VHOST_DNS_API_TOKEN's default is
      # therefore a token-SHAPED placeholder (the Cloudflare module checks
      # only that it looks like a token, not that it works) -- 40 characters,
      # matching a real Cloudflare API token's length, purely to stop the
      # length itself looking like the significant part; the actual failure
      # mode this default exists to avoid is EMPTINESS, and ${VAR:-default}
      # already covers both unset and empty. VHOST_ZONE's default mirrors
      # LISTMONK_DOMAIN's ".invalid" pattern so the resulting wildcard cert
      # request fails the same harmless, already-proven-safe way theirs do
      # (rejected by Let's Encrypt as not a public suffix, logged, retried
      # in the background -- never fatal). Both are real values once set in
      # .env; see docker_deployment.md's "Custom domains" section.
      VHOST_ZONE: ${VHOST_ZONE:-vhost.invalid}
      VHOST_DNS_API_TOKEN: ${VHOST_DNS_API_TOKEN:-vhost-dns-api-token-not-configured-00000}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - internal

  # Pressroom's database and media, nightly. The back-office databases are
  # backed up beside their services (backoffice-backup, in the overlay).
  backup:
    # The app image, for pg_dump/psql plus the baked-in backup scripts. See
    # /app/backup/backup.sh for the RESTORE procedure.
    image: ghcr.io/jakefearsd/pressroom:${IMAGE_VERSION:?IMAGE_VERSION must be set in .env}
    logging: *logging
    entrypoint: ["/app/backup/loop.sh"]
    # Runs as root, unlike every other use of this image: the pressroom-backups
    # volume is created root-owned, and the unprivileged `pressroom` user the image
    # otherwise runs as cannot write into it. A backup that cannot write fails
    # at 03:00, not at deploy time, so this is not a detail to leave implicit.
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pressroom}
      POSTGRES_USER: ${POSTGRES_USER:-pressroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGHOST: postgres
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - pressroom-backups:/backups
      - pressroom-mediafiles:/data/mediafiles:ro
      # No search index: backup.sh leaves it out, since the app rebuilds it
      # from the database whenever it finds none.
      - pressroom-uploads:/data/uploads:ro
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  pressroom-pgdata:
  pressroom-mediafiles:
  pressroom-search-index:
  pressroom-uploads:
  pressroom-backups:
  caddy-data:
  caddy-config:
